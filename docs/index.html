<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Need It! Got It! | BOOK A SERVICE✨</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    emailjs.init("SU4xs5Go_As6GQEfL");
  </script>

  <!-- ✅ SUPABASE CDN (MUST LOAD FIRST) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="container">
  <h1>BOOK A SERVICE✨</h1>
  <p class="subtitle">Fast • Reliable • Transparent Pricing</p>

  <form id="bookingForm">

    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Phone Number</label>
    <input type="tel" name="phone" required>

    <label>Service Category</label>
    <select name="category" required>
      <option value="">Select category</option>
      <option>Home & Property</option>
      <option>Personal & Care</option>
      <option>Creative & Media</option>
      <option>Events & Promotion</option>
    </select>

    <label>Service</label>
    <select name="service" required>
      <option value="">Select service</option>
      <option>Home Cleaning</option>
      <option>Window Cleaning</option>
      <option>Babysitting</option>
      <option>Event Staff</option>
      <option>Delivery Assistance*</option>
    </select>

    <label>Date</label>
    <input type="date" name="date" required>

    <label>Preferred Time</label>
    <select name="time" required>
      <option value="">Select time</option>
    </select>

    <label>Additional Details</label>
    <textarea name="details"></textarea>

    <label style="margin-top:15px;">
      <input type="checkbox" id="agreeTerms" required>
      I have read and agree to the Terms & Conditions
    </label>

    <button type="submit">Submit Booking</button>
  </form>
</div>

<!-- ✅ FINAL JS (SAFE, WRAPPED, GUARANTEED TO RUN) -->
<script src="script.js"></script>

</body>
</html>
