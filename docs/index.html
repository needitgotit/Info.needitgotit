 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Need It! Got It! | Book a Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>Book a Service</h1>
    <p class="subtitle">Fast • Reliable • Transparent Pricing</p>

    <form id="bookingForm">

      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="tel" name="phone" required>

      <label>Service Category</label>
      <select name="category" required>
        <option value="">Select category</option>
        <option>Home & Property</option>
        <option>Personal & Care</option>
        <option>Delivery & Support</option>
        <option>Events & Promotion</option>
      </select>

      <label>Service</label>
      <select name="service" required>
        <option value="">Select service</option>
        <option>Home Cleaning – from $39/hr</option>
        <option>Window Cleaning – from $34/hr</option>
        <option>Property Cleaning – from $45/hr</option>
        <option>Interior Decoration – from $45/hr</option>
        <option>Babysitting – from $22/hr</option>
        <option>Dog Walking – from $18/hr</option>
        <option>Event Staff – from $28/hr</option>
        <option>Promoter – from $35/hr</option>
      </select>

      <label>Date</label>
      <input type="date" name="date" required>

      <label>Preferred Time</label>
      <select name="time" required>
        <option value="">Select time</option>
        <option>Morning (8am – 12pm)</option>
        <option>Afternoon (12pm – 4pm)</option>
        <option>Evening (4pm – 8pm)</option>
      </select>

      <label>Additional Details</label>
      <textarea name="details" placeholder="Tell us anything we should know..."></textarea>

      <button type="submit">Submit Booking</button>

    </form>

    <p class="footer-note">
      You’ll receive a confirmation email after submitting.
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
