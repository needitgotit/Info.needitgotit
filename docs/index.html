  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Need It! Got It! | Book a Service</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("SU4xs5Go_As6GQEfL"); // 
    })();
  </script>
</head>

<body>

  <div class="container">
    <h1>Book a Service</h1>
    <p class="subtitle">Fast • Reliable • Transparent Pricing</p>

    <form id="booking-form">

      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="tel" name="phone" required>

      <label>Service Category</label>
      <select name="category" required>
        <option value="">Select category</option>
        <option>Home & Property</option>
        <option>Personal & Care</option>
        <option>Delivery & Support</option>
        <option>Events & Promotion</option>
      </select>

      <label>Service</label>
      <select name="service" required>
        <option value="">Select service</option>

        <optgroup label="HOME & PROPERTY SERVICES">
          <option>Home Cleaning</option>
          <option>Window Cleaning</option>
          <option>Property Cleaning</option>
          <option>Interior Decoration</option>
        </optgroup>

        <optgroup label="PERSONAL & CARE">
          <option>Babysitting</option>
          <option>Dog Walking</option>
          <option>Personal Shopper</option>
          <option>Assistant</option>
          <option>Friendship</option>
          <option>FREE</option>
        </optgroup>

        <optgroup label="DELIVERY & SUPPORT">
          <option>Vocalist</option>
          <option>Songwriting</option>
          <option>Model</option>
          <option>Clothing Stylist</option>
          <option>Food Reviewer</option>
        </optgroup>

        <optgroup label="EVENTS & PROMOTION">
          <option>Event Staff</option>
          <option>Cater Help</option>
          <option>Promoter</option>
          <option>Sales</option>
        </optgroup>
      </select>

      <label>Date</label>
      <input type="date" name="date" required>

      <label>Preferred Time</label>
      <select name="time" required>
        <option value="">Select time</option>
        <option>Morning (8am – 12pm)</option>
        <option>Afternoon (12pm – 4pm)</option>
        <option>Evening (4pm – 8pm)</option>
      </select>

      <label>Additional Details</label>
      <textarea name="details" placeholder="Tell us anything we should know..."></textarea>

      <button type="submit">Submit Booking</button>
    </form>

    <div id="form-status" style="margin-top:1rem;color:green;"></div>

    <p class="footer-note">
      You’ll receive a confirmation email after submitting.
    </p>
  </div>

  <script>
    // EmailJS form submission
    document.getElementById("booking-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const form = this;
      const status = document.getElementById("form-status");

      emailjs.sendForm("service_tpy3o7q", "template_7j2yea8", form) // 
        .then(function() {
          status.innerHTML = "Thanks! Your booking was submitted successfully ✅";
          form.reset();
        }, function(error) {
          console.error("EmailJS error:", error);
          status.innerHTML = "Oops! Something went wrong. Please try again.";
        });
    });
  </script>

</body>
</html>
